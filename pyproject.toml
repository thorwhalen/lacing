[build-system]
requires = [
    "hatchling",
]
build-backend = "hatchling.build"

[project]
name = "lacing"
version = "0.0.18"
description = "Interval annotation system"
readme = "README.md"
requires-python = ">=3.10"
keywords = []
authors = [
    { name = "Thor Whalen" },
]
dependencies = [
    "pydantic>=2.6",
    "intervaltree>=3.1",
    "argh>=0.30",
]

[project.scripts]
lacing = "lacing.cli:main"

[project.license]
text = "mit"

[project.urls]
Homepage = "https://github.com/thorwhalen/lacing"
Repository = "https://github.com/thorwhalen/lacing"
Documentation = "https://thorwhalen.github.io/lacing"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.1.0",
    "praatio>=6.0",
    "pympi-ling>=1.7",
    "jams>=0.3",
    "psycopg[binary]>=3.1",
    "pytest-postgresql>=6.0",
    "fastapi>=0.100",
    "httpx>=0.24",
    "python-multipart>=0.0.6",
    "mcp>=1.0",
    "opentimelineio>=0.17",
    "opentelemetry-api>=1.20",
    "opentelemetry-sdk>=1.20",
]
docs = [
    "sphinx>=6.0",
    "sphinx-rtd-theme>=1.0",
]
textgrid = [
    "praatio>=6.0",
]
eaf = [
    "pympi-ling>=1.7",
]
jams = [
    "jams>=0.3",
]
postgres = [
    "psycopg[binary]>=3.1",
]
server = [
    "fastapi>=0.100",
    "httpx>=0.24",
    "python-multipart>=0.0.6",
    "uvicorn>=0.20",
]
mcp = [
    "mcp>=1.0",
]
arq = [
    "arq>=0.25",
]
otio = [
    "opentimelineio>=0.17",
]
otel = [
    "opentelemetry-api>=1.20",
    "opentelemetry-sdk>=1.20",
]

[tool.ruff]
line-length = 88
target-version = "py310"
exclude = [
    "**/*.ipynb",
    ".git",
    ".venv",
    "build",
    "dist",
    "tests",
    "examples",
    "scrap",
]

[tool.ruff.lint]
select = [
    "D100",
]
ignore = [
    "D203",
    "E501",
    "B905",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"**/tests/*" = [
    "D",
]
"**/examples/*" = [
    "D",
]
"**/scrap/*" = [
    "D",
]

[tool.pytest.ini_options]
minversion = "6.0"
testpaths = [
    "tests",
]
doctest_optionflags = [
    "NORMALIZE_WHITESPACE",
    "ELLIPSIS",
]

[tool.wads.ci]
project_name = ""

[tool.wads.ci.commands]
pre_test = []
test = []
post_test = []
lint = []
format = []

[tool.wads.ci.env]
required_envvars = []
test_envvars = []
extra_envvars = []

[tool.wads.ci.env.defaults]

[tool.wads.ci.quality.ruff]
enabled = true

[tool.wads.ci.quality.black]
enabled = false

[tool.wads.ci.quality.mypy]
enabled = false

[tool.wads.ci.testing]
python_versions = [
    "3.10",
    "3.12",
]
pytest_args = [
    "-v",
    "--tb=short",
]
coverage_enabled = true
coverage_threshold = 0
coverage_report_format = [
    "term",
    "xml",
]
exclude_paths = [
    "examples",
    "scrap",
]
test_on_windows = true

[tool.wads.ci.metrics]
enabled = true
config_path = ".github/umpyre-config.yml"
storage_branch = "code-metrics"
python_version = "3.10"
force_run = false

[tool.wads.ci.build]
sdist = true
wheel = true

[tool.wads.ci.publish]
enabled = true

[tool.wads.ci.docs]
enabled = true
builder = "epythet"
ignore_paths = [
    "tests/",
    "scrap/",
    "examples/",
]
